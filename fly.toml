# Fly.io app config. `fly launch` will fill in the app name; leave the rest.

primary_region = "lhr"     # London — closest to the FPL API and most users

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Free-tier friendly: machines stop when idle, wake on first request.
  # Cold starts are ~1s for this app.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

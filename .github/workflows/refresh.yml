name: fpl-refresh-pipeline

# Runs daily at 06:00 UTC. A weekly (Tuesday) schedule left data up to three
# days stale by the time a Friday/Saturday deadline came round — prices move
# daily and injury news lands in Thursday/Friday press conferences. FPL
# deadlines also shift between Fri, Sat and the occasional midweek round, so a
# fixed weekday can't track them.
#
# Cost of the extra runs is low: the deploy step below is gated on artifacts
# actually changing, so quiet days finish at the commit step without touching
# the running machine.
#
# Twice daily, and deliberately not on the hour. GitHub's scheduler is
# best-effort and queues hardest at :00, where runs are delayed by up to a
# couple of hours or dropped outright — the first `0 6 * * *` slot after this
# workflow landed produced no run at all. An odd minute sits outside that
# crush.
#
# Two runs because one is not enough to be current at a deadline: the morning
# run can be eleven hours stale by a 17:30 kickoff, and Friday press
# conferences move prices and availability inside that window. Neither run is
# a guarantee, so the site states its own data age rather than implying
# freshness it cannot promise.
on:
  schedule:
    - cron: "23 6 * * *"
    - cron: "23 15 * * *"
  workflow_dispatch: {}

concurrency:
  group: fpl-refresh-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the artifact commit back
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact patch on purpose: astral-sh/setup-uv publishes
      # v10.0.0 / v10.0.1 but no floating `v10` major tag, so `@v10` fails
      # to resolve at workflow setup. Bump this explicitly when upgrading.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ingest historical seasons (vaastav CSVs)
        run: uv run fpl ingest-history

      - name: Ingest current-season data
        run: |
          uv run fpl ingest
          uv run fpl stage
          uv run fpl ingest-live-history

      - name: Train ML predictor
        run: uv run fpl train

      # Deliberately placed before export and allowed to fail the job. A
      # feature whose live values fall outside its training range is dead
      # weight the model cannot report on its own -- that is exactly how the
      # fixture-difficulty features stayed inert for a month while every run
      # went green. Failing here leaves the previously deployed artifacts
      # serving, which is the safer of the two wrong answers.
      - name: Validate live features against training ranges
        run: uv run fpl validate

      - name: Export latest squad + projections
        run: uv run fpl export --projector ml

      - name: Commit artifacts if they changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artifacts
          if git diff --staged --quiet; then
            echo "No artifact changes — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "weekly: refresh projections + squad for $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub deliberately does not trigger workflows from commits authored by
      # the default GITHUB_TOKEN, so the push above will NOT fire fly-deploy.yml.
      # Without this step the live site keeps serving last week's projections.
      - name: Install flyctl
        if: steps.commit.outputs.changed == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy refreshed artifacts
        if: steps.commit.outputs.changed == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

name: fpl-refresh-pipeline

# How this schedule got here, so the next change is not a guess:
#
# Weekly (Tuesday) left data three days stale by a Friday deadline — prices
# move nightly and injury news lands in Thursday/Friday press conferences.
# Daily at 06:00 then produced *zero* scheduled runs: GitHub's cron is
# best-effort and queues hardest on the hour, so runs are delayed by hours or
# dropped. Every minute here is deliberately odd. Twice daily followed,
# because a morning fetch is eleven hours old by a 17:30 deadline.
#
# The Sunday evening run closes the last gap: a round finishing ~17:20 Sunday
# sat behind an "in progress" banner until Monday morning.
#
# None of this is a guarantee, which is why the site states its own data age
# and round status rather than implying a freshness cron cannot promise.
#
# Cost of extra runs is low: the deploy step is gated on artifacts actually
# changing, so a quiet run stops at the commit step.
on:
  schedule:
    - cron: "23 6 * * *"
    - cron: "23 15 * * *"
    # Sunday evening, after a typical round's last whistle. Without it a round
    # ending ~17:20 Sunday sat behind an "in progress" banner until Monday
    # 06:23, because the 15:23 run lands before the last kickoff. Rounds that
    # end on a Monday night still wait for the Tuesday morning run — cron
    # cannot see the fixture list, so this closes the common case, not all of
    # them.
    - cron: "23 19 * * 0"
  workflow_dispatch: {}

concurrency:
  group: fpl-refresh-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the artifact commit back
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact patch on purpose: astral-sh/setup-uv publishes
      # v10.0.0 / v10.0.1 but no floating `v10` major tag, so `@v10` fails
      # to resolve at workflow setup. Bump this explicitly when upgrading.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ingest historical seasons (vaastav CSVs)
        run: uv run fpl ingest-history

      - name: Ingest current-season data
        run: |
          uv run fpl ingest
          uv run fpl stage
          uv run fpl ingest-live-history

      - name: Train ML predictor
        run: uv run fpl train

      # Deliberately placed before export and allowed to fail the job. A
      # feature whose live values fall outside its training range is dead
      # weight the model cannot report on its own -- that is exactly how the
      # fixture-difficulty features stayed inert for a month while every run
      # went green. Failing here leaves the previously deployed artifacts
      # serving, which is the safer of the two wrong answers.
      - name: Validate live features against training ranges
        run: uv run fpl validate

      - name: Export latest squad + projections
        run: uv run fpl export --projector ml

      - name: Commit artifacts if they changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artifacts
          if git diff --staged --quiet; then
            echo "No artifact changes — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "weekly: refresh projections + squad for $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub deliberately does not trigger workflows from commits authored by
      # the default GITHUB_TOKEN, so the push above will NOT fire fly-deploy.yml.
      # Without this step the live site keeps serving last week's projections.
      - name: Install flyctl
        if: steps.commit.outputs.changed == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy refreshed artifacts
        if: steps.commit.outputs.changed == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
